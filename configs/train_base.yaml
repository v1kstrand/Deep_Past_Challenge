data_root: /notebooks/kaggle/Deep-Past-Challenge/data
train_path: train.csv
test_path: test.csv

id_col: id
src_col: transliteration
tgt_col: translation

src_prefix: "translate Akkadian to English: "
preprocess_inputs: true
use_sentence_aligner: true
align_min_len: 3

val_split: 0.1
seed: 42

model_name: google/byt5-small
tokenizer_name: null

max_source_len: 256
max_target_len: 256
gen_max_len: 256
num_beams: 4

# Fast validation decode
val_gen_max_len: 128
val_num_beams: 1

device: cuda
epochs: 3
batch_size: 64
eval_batch_size: 64
gradient_accumulation_steps: 1
lr: 1e-4
weight_decay: 0.0
warmup_steps: 0
grad_clip: 1.0
trainable_dtype: bf16

log_every: 50
eval_strategy: epoch
save_strategy: epoch
save_total_limit: 1
output_dir: /notebooks/kaggle/Deep-Past-Challenge/outputs
run_name: train_base
comet_project_name: dpcV0
comet_experiment_key: 
